<nav class="nav">
    <a href="#hero" class="nav-brand" (click)="scrollToSection('about'); $event.preventDefault()">
        <img class="brand-logo" src="assets/icon.png" alt="LotusZaheer" width="22" height="22">
        <span class="brand-name">{{ displayName }}</span>
    </a>

    <ul class="nav-links" [class.active]="mobileMenuOpen">
        <li>
            <a href="#about" (click)="scrollToSection('about'); mobileMenuOpen = false; $event.preventDefault()"
                [class.active]="activeSection === 'about'">{{ 'sections.about' | translate }}</a>
        </li>
        <li>
            <a href="#skills" (click)="scrollToSection('skills'); mobileMenuOpen = false; $event.preventDefault()"
                [class.active]="activeSection === 'skills'">{{ 'sections.skills' | translate }}</a>
        </li>
        <li>
            <a href="#experience" (click)="scrollToSection('experience'); mobileMenuOpen = false; $event.preventDefault()"
                [class.active]="activeSection === 'experience'">{{ 'sections.experience' | translate }}</a>
        </li>
        <li>
            <a href="#projects" (click)="scrollToSection('projects'); mobileMenuOpen = false; $event.preventDefault()"
                [class.active]="activeSection === 'projects'">{{ 'sections.projects' | translate }}</a>
        </li>
        <li>
            <a href="#contact" (click)="scrollToSection('contact'); mobileMenuOpen = false; $event.preventDefault()"
                [class.active]="activeSection === 'contact'">{{ 'sections.contact' | translate }}</a>
        </li>
    </ul>

    <div class="nav-actions">
        <div class="lang-switch" (click)="switchLanguage()">
            <button [class.active]="currentLang === 'es'" type="button">ES</button>
            <button [class.active]="currentLang === 'en'" type="button">EN</button>
        </div>
        <button class="btn btn-primary cv-btn" type="button" (click)="downloadCV()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span class="cv-label">{{ 'about.downloadCV' | translate }}</span>
        </button>
        <button class="nav-mobile-toggle" type="button" [class.active]="mobileMenuOpen" (click)="toggleMobileMenu()"
            aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</nav>
