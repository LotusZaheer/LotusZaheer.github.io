<div class="container">
    <div class="section-header">
        <div class="section-eyebrow">05 · {{ 'contact.eyebrow' | translate }}</div>
        <h2 class="section-title">{{ 'sections.contact' | translate }}</h2>
        <p class="section-subtitle">{{ 'contact.subtitle' | translate }}</p>
    </div>

    <aside class="contact-side">
        <h3>{{ 'contact.socialTitle' | translate }}</h3>
        <p>{{ 'contact.socialDescription' | translate }}</p>

        <div class="contact-list">
            @for (method of contactMethods; track method.name) {
            <a [href]="method.url" target="_blank" class="contact-item">
                <div class="ico">
                    <img [src]="method.icon" [alt]="method.name" loading="lazy" decoding="async">
                </div>
                <div class="info">
                    <div class="name">{{ method.name }}</div>
                    <div class="val">{{ method.nick }}</div>
                </div>
                <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
            }
        </div>
    </aside>
</div>
