<h2 class="section-title">{{ 'sections.skills' | translate }}</h2>
<div class="tech-stack">
    @for (cat of categories; track cat.id) {
    <div class="tech-category">
        <h3>{{ cat.name | translate }}</h3>

        <div class="tech-icons">
            @for (skill of cat.skills; track skill.id) {
            <div class="tech-icon">
                @if (getIcon(skill)) {
                <img [src]="getIcon(skill)" [alt]="skill.name | translate" class="tech-image"
                    loading="lazy" decoding="async">
                } @else {
                <!-- Fallback if needed, currently just hiding image -->
                }
                <span>{{ skill.name | translate }}</span>
            </div>
            }
            @if (cat.skills.length === 0) {
            <p class="empty-category">...</p>
            }
        </div>
    </div>
    }
</div>
