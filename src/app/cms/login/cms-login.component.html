<div class="cms-login-container">
  <div class="cms-login-card">
    <div class="cms-login-header">
      <span class="cms-lock-icon">🔒</span>
      <h2>CMS Panel</h2>
      <p>Ingresa la contraseña para administrar tu portafolio</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="cms-login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" required
          autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required
          autocomplete="current-password" />
      </div>

      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="btn-login" [disabled]="loading || !password">
        {{ loading ? 'Verificando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
