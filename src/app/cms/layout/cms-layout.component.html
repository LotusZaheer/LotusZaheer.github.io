<div class="cms-wrapper" [class.mobile-open]="mobileMenuOpen">
    <!-- Top Header for Mobile -->
    <header class="mobile-header">
        <button class="menu-toggle" (click)="toggleMobileMenu()">
            <span class="material-icons">{{ mobileMenuOpen ? 'close' : 'menu' }}</span>
        </button>
        <h3 class="brand-logo">LotusZaheer <span class="cms-badge">CMS</span></h3>
        <div class="header-spacer"></div>
    </header>

    <!-- Overlay Backdrop -->
    <div class="sidebar-overlay" (click)="closeMobileMenu()"></div>

    <aside class="cms-sidebar" [class.collapsed]="sidebarCollapsed" [class.open]="mobileMenuOpen">
        <div class="sidebar-header">
            <h3 *ngIf="!sidebarCollapsed" class="brand-logo">LotusZaheer <span class="cms-badge">CMS</span></h3>
            <button class="toggle-btn" (click)="toggleSidebar()">
                <span class="material-icons">{{ sidebarCollapsed ? 'chevron_right' : 'chevron_left' }}</span>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.route === '/cms' }" (click)="closeMobileMenu()"
                class="nav-item">
                <span class="material-icons">{{ item.icon }}</span>
                <span class="nav-label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a class="back-btn" routerLink="/" (click)="closeMobileMenu()">
                <span class="material-icons">home</span>
                <span class="nav-label" *ngIf="!sidebarCollapsed">Volver al sitio</span>
            </a>
            <button class="logout-btn" (click)="logout()">
                <span class="material-icons">logout</span>
                <span class="nav-label" *ngIf="!sidebarCollapsed">Cerrar sesión</span>
            </button>
        </div>
    </aside>

    <main class="cms-content">
        <router-outlet></router-outlet>
    </main>
</div>
