<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Icons&display=swap"
    rel="stylesheet">
  <!-- Script para GitHub Pages SPA -->
  <script type="text/javascript">
    // Este script maneja la redirección desde 404.html para SPA
    (function (l) {
      if (l.search[1] === 'p') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).filter(function (s) {
          return s !== ''
        }).reduce(function (obj, p) {
          var kv = p.split('=');
          obj[kv[0]] = kv[1];
          return obj;
        }, {});
        if (decoded.p !== undefined) {
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + (decoded.p || '') +
            (decoded.q ? ('?' + decoded.q) : '') +
            l.hash
          );
        }
      }
    }(window.location));
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
