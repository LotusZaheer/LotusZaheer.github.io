name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Environment Files
        run: |
          mkdir -p src/environments
          echo "export const environment = { production: false, supabase: { url: '', key: '' }, secrets: { projectPassword: '' } };" > src/environments/environment.ts
          echo "export const environment = { production: true, supabase: { url: '${{ secrets.SUPABASE_URL }}', key: '${{ secrets.SUPABASE_ANON_KEY }}' }, secrets: { projectPassword: '${{ secrets.PROJECT_PASSWORD }}' } };" > src/environments/environment.prod.ts

      - name: Build (production)
        run: npm run build -- --configuration=production --base-href=/

      - name: Validate build output
        run: |
          if [ ! -d "dist/portfolio/browser" ]; then
            echo "Build output not found"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
